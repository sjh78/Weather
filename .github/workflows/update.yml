name: Update Weather
 
on:
workflow_dispatch:

jobs:
update:
runs-on: ubuntu-latest

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: '3.12'

- name: Run Script
run: python update_weather.py
 
- name: Commit Files
run: |
git config user.name github-actions
git config user.email github-actions@github.com
git add weather.csv currentwx.txt
git commit -m "Update weather" || echo "No changes"
git push
