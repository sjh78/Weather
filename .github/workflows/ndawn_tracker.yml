name: Recurring NDAWN Data Fetcher

on:
  schedule:
    # Runs every 15 minutes (* means any hour, day, or month)
    - cron: '15 15 1 * *'
  # Allows you to manually trigger the workflow from the GitHub "Actions" tab
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Check out your repository files
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. Install required packages
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Execute your data script
    - name: Run Fetch Script
      run: python fetch_ndawn.py

    # 5. Automatically push the updated CSV back into your repo
    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add ndawn_latest_conditions.csv
        
        # Check if anything actually changed before committing to prevent empty errors
        if git diff --staged --quiet; then
          echo "No new changes to commit"
        else
          git commit -m "Automated update: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
          git push
        fi
